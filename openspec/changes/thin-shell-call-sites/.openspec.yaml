# No spec delta, and deliberately so.
#
# The seven call sites this change repairs are all ALREADY specified by `validator-onboarding`
# (7 requirements / 24 scenarios). Nothing about the product's behaviour changes here: every one
# of those sites currently behaves correctly, and this change adds the tests that pin them.
#
# `openspec instructions specs` is explicit on this point - a change with no spec-level behaviour
# change "must set `skip_specs: true`" and must not "invent a requirement just to satisfy
# validation". Adding a requirement of the shape "a test must exist for X" would be exactly that:
# a requirement invented to fill a validator, not one derived from an observed behaviour.
#
# The durable, generalisable lesson from this investigation is a *verification* lesson, and this
# repository already has the right home for those: `AGENTS.md`. It is not spec-governed, and it
# records the six prior vacuous-guard findings in the same terms. See task 4.2.
skip_specs: true
